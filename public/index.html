<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTrack — AI Product Competitive Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'oklch(0.99 0.0057 84.57)',
            foreground: 'oklch(0.145 0 0)',
            muted: { foreground: 'oklch(0.556 0 0)' },
            primary: { DEFAULT: '#2563eb', foreground: '#ffffff' },
            accent: { DEFAULT: 'oklch(0.96 0.005 84)', foreground: 'oklch(0.145 0 0)' },
            border: 'oklch(0.922 0 0)',
            card: { DEFAULT: '#ffffff', foreground: 'oklch(0.145 0 0)' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .markdown-body h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem; letter-spacing: -0.02em; }
    .markdown-body h2 { font-size: 1.15rem; font-weight: 600; margin: 1.25rem 0 0.5rem; padding-bottom: 0.375rem; border-bottom: 1px solid oklch(0.922 0 0); }
    .markdown-body h3 { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .markdown-body p { margin: 0.5rem 0; line-height: 1.75; }
    .markdown-body ul, .markdown-body ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .markdown-body li { margin: 0.25rem 0; line-height: 1.6; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
    .markdown-body th, .markdown-body td { padding: 0.625rem 0.875rem; border: 1px solid oklch(0.922 0 0); text-align: left; }
    .markdown-body th { background: oklch(0.97 0.005 84); font-weight: 600; }
    .markdown-body tr:hover td { background: oklch(0.98 0.005 84); }
    .markdown-body code { background: oklch(0.97 0.005 84); padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
    .markdown-body pre { background: #1e293b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    .markdown-body pre code { background: none; padding: 0; color: #e2e8f0; }
    .markdown-body strong { font-weight: 600; }
    .markdown-body hr { border: none; border-top: 1px solid oklch(0.922 0 0); margin: 1.5rem 0; }
    .markdown-body em { font-style: italic; color: oklch(0.556 0 0); }
    .loading-dot { animation: pulse 1.5s ease-in-out infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
    .sidebar-collapsed { width: 52px !important; }
    .hero-gradient { background: radial-gradient(ellipse at center, oklch(0.97 0.01 240) 0%, transparent 70%); }
  </style>
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <!-- Header -->
  <header class="group sticky top-0 z-50 w-full border-b border-transparent backdrop-blur-lg bg-background/60">
    <div class="m-auto h-fit max-w-[100rem] px-4 sm:px-8">
      <div class="flex h-14 items-center gap-3">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5 text-foreground no-underline shrink-0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
            <path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
          <span class="text-lg font-semibold tracking-tight">PTrack</span>
        </a>

        <!-- Nav -->
        <nav class="hidden sm:flex items-center gap-1 ml-2">
          <a href="#" class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium text-muted-foreground hover:text-foreground h-8 rounded-md px-3 transition-colors">Analyze</a>
        </nav>

        <!-- Right actions -->
        <div class="ml-auto flex items-center gap-2">
          <a href="https://github.com" target="_blank" class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium text-muted-foreground hover:text-foreground h-8 w-8 rounded-md transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Layout: Sidebar + Content -->
  <div class="flex min-h-[calc(100vh-3.5rem)]">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="sticky top-14 hidden w-56 shrink-0 border-r border-border/60 bg-[#d9d9d9]/10 py-4 transition-all duration-200 sm:flex sm:flex-col">
      <div class="flex w-full flex-col gap-1 px-3">
        <div class="flex items-center gap-2 px-3 py-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-muted-foreground"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="text-sm font-medium text-foreground">Analysis</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-muted-foreground"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="text-sm text-muted-foreground hover:text-foreground transition-colors cursor-pointer">History</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
      <!-- Hero Section -->
      <section id="heroSection" class="relative">
        <!-- Gradient background -->
        <div class="hero-gradient absolute inset-0 pointer-events-none"></div>

        <div class="relative z-10 mx-auto mt-16 mb-16 max-w-[700px] px-4 sm:px-6 duration-300">
          <h1 class="text-center text-2xl font-bold tracking-tight mb-2 text-foreground sm:text-3xl">
            AI Product Intelligence
          </h1>
          <p class="text-center text-muted-foreground mb-8 text-sm sm:text-base">
            Paste a URL. Get a structured competitive snapshot in seconds.
          </p>

          <!-- Input Area -->
          <div id="inputContainer" class="relative z-10">
            <div class="group relative overflow-hidden rounded-2xl border border-border bg-white shadow-[0_0_8px_rgba(0,0,0,0.06)] focus-within:border-primary/40 hover:border-primary/20 transition-all duration-200">
              <div class="flex items-center">
                <input
                  id="urlInput"
                  type="text"
                  placeholder="Paste any URL about an AI product — news, social media, blog, product page..."
                  class="flex-1 h-16 border-none bg-transparent px-5 text-base outline-none placeholder:text-muted-foreground/50"
                  autofocus
                />
                <button
                  id="analyzeBtn"
                  class="inline-flex items-center justify-center whitespace-nowrap rounded-xl text-sm font-medium transition-all h-10 px-5 mr-2 bg-primary text-primary-foreground hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed shrink-0 gap-2"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                  <span class="hidden sm:inline">Analyze</span>
                </button>
              </div>
            </div>
            <p class="text-xs text-muted-foreground/60 mt-2.5 pl-1">
              Supports any public URL — product pages, news, Twitter, Xiaohongshu, WeChat articles...
            </p>
          </div>
        </div>
      </section>

      <!-- Loading State -->
      <section id="loadingSection" class="hidden max-w-[700px] mx-auto px-4 sm:px-6 py-12 w-full">
        <div class="flex flex-col items-center gap-4">
          <div class="flex gap-1.5">
            <div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
            <div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
            <div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
          </div>
          <p id="loadingText" class="text-sm text-muted-foreground">Fetching page content...</p>
        </div>
      </section>

      <!-- Error State -->
      <section id="errorSection" class="hidden max-w-[700px] mx-auto px-4 sm:px-6 py-8 w-full">
        <div class="rounded-xl border border-red-100 bg-red-50/60 p-5">
          <div class="flex items-start gap-3">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-500 mt-0.5 shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div class="min-w-0">
              <h3 id="errorTitle" class="text-sm font-medium text-red-800">Error</h3>
              <p id="errorMessage" class="text-sm text-red-600 mt-1"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- Results Section -->
      <section id="resultsSection" class="hidden max-w-[900px] mx-auto px-4 sm:px-6 py-6 w-full">
        <!-- View Tabs -->
        <div class="flex gap-4 mb-6 border-b border-border">
          <button id="tabMarkdown" class="relative pb-2.5 text-sm font-medium tab-active transition-colors" onclick="switchTab('markdown')">
            Product
          </button>
          <button id="tabFeedback" class="relative pb-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors" onclick="switchTab('feedback')">
            Feedback
          </button>
          <button id="tabJson" class="relative pb-2.5 text-sm font-medium text-muted-foreground hover:text-foreground transition-colors" onclick="switchTab('json')">
            JSON
          </button>
          <span id="cachedBadge" class="ml-auto text-xs text-muted-foreground/60 self-center hidden">
            Cached result
          </span>
        </div>

        <!-- Markdown View -->
        <div id="markdownView" class="markdown-body bg-white rounded-xl border border-border p-6 sm:p-8"></div>

        <!-- Feedback View -->
        <div id="feedbackView" class="hidden"></div>

        <!-- JSON View -->
        <div id="jsonView" class="hidden">
          <pre class="bg-[#1e293b] text-gray-100 p-6 rounded-xl overflow-x-auto text-sm leading-relaxed"><code id="jsonCode"></code></pre>
        </div>

        <!-- Meta -->
        <div id="metaInfo" class="mt-5 flex items-center gap-4 text-xs text-muted-foreground/70 flex-wrap"></div>
      </section>

      <!-- Empty placeholder when no results yet -->
      <section id="emptySection" class="hidden max-w-[700px] mx-auto px-4 sm:px-6 py-16 w-full text-center">
        <p class="text-sm text-muted-foreground">Enter a URL above to get started</p>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
