<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-PTracking — AI Product Competitive Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }
    .markdown-body h2 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid #e5e7eb; }
    .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .markdown-body p { margin: 0.5rem 0; line-height: 1.7; }
    .markdown-body ul, .markdown-body ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .markdown-body li { margin: 0.25rem 0; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .markdown-body th, .markdown-body td { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; text-align: left; }
    .markdown-body th { background: #f3f4f6; font-weight: 600; }
    .markdown-body code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
    .markdown-body pre { background: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    .markdown-body pre code { background: none; padding: 0; color: #e5e7eb; }
    .markdown-body strong { font-weight: 600; }
    .markdown-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0; }
    .markdown-body em { font-style: italic; color: #6b7280; }
    .loading-dot { animation: pulse 1.5s ease-in-out infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
  </style>
</head>
<body class="bg-white min-h-screen">
  <!-- Header -->
  <header class="border-b border-gray-100">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
        <span class="font-semibold text-lg">P<span class="text-blue-600">Track</span></span>
      </div>
      <nav class="flex gap-4 text-sm text-gray-500">
        <a href="#" class="hover:text-gray-900">About</a>
      </nav>
    </div>
  </header>

  <!-- Hero / Input Section -->
  <section class="max-w-3xl mx-auto px-4 pt-16 pb-8">
    <h1 class="text-3xl font-bold text-center mb-3 text-gray-900">
      AI Product Competitive Intelligence
    </h1>
    <p class="text-center text-gray-500 mb-10 text-lg">
      Paste a URL. Get a structured competitive snapshot in seconds.
    </p>

    <!-- Input Form -->
    <div class="relative">
      <div class="flex gap-2">
        <div class="flex-1 relative">
          <input
            id="urlInput"
            type="url"
            placeholder="Paste a product URL — any link about an AI product..."
            class="w-full px-4 py-3.5 pr-12 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"
            autofocus
          />
          <div id="platformBadge" class="absolute right-3 top-1/2 -translate-y-1/2 hidden">
            <span id="platformLabel" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md"></span>
          </div>
        </div>
        <button
          id="analyzeBtn"
          class="px-6 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Analyze
        </button>
      </div>
      <p class="text-xs text-gray-400 mt-2 pl-1">
        Supports any public URL — product pages, news, Twitter, Xiaohongshu, WeChat articles...
      </p>
    </div>
  </section>

  <!-- Loading State -->
  <section id="loadingSection" class="max-w-3xl mx-auto px-4 py-12 hidden">
    <div class="flex flex-col items-center gap-3">
      <div class="flex gap-1">
        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
        <div class="w-2 h-2 bg-blue-600 rounded-full loading-dot"></div>
      </div>
      <p class="text-gray-500 text-sm" id="loadingText">Analyzing product data...</p>
    </div>
  </section>

  <!-- Error State -->
  <section id="errorSection" class="max-w-3xl mx-auto px-4 py-8 hidden">
    <div class="bg-red-50 border border-red-100 rounded-xl p-6">
      <div class="flex items-start gap-3">
        <svg class="w-5 h-5 text-red-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div>
          <h3 class="font-medium text-red-800" id="errorTitle">Error</h3>
          <p class="text-red-600 text-sm mt-1" id="errorMessage"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Results Section -->
  <section id="resultsSection" class="max-w-4xl mx-auto px-4 py-8 hidden">
    <!-- View Toggle -->
    <div class="flex gap-4 mb-6 border-b border-gray-100">
      <button id="tabMarkdown" class="pb-2.5 text-sm font-medium tab-active" onclick="switchTab('markdown')">
        Report
      </button>
      <button id="tabJson" class="pb-2.5 text-sm font-medium text-gray-400 hover:text-gray-600" onclick="switchTab('json')">
        JSON
      </button>
      <span id="cachedBadge" class="ml-auto text-xs text-gray-400 self-center hidden">
        Cached result
      </span>
    </div>

    <!-- Markdown View -->
    <div id="markdownView" class="markdown-body bg-white rounded-xl p-6 border border-gray-100"></div>

    <!-- JSON View -->
    <div id="jsonView" class="hidden">
      <pre class="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto text-sm"><code id="jsonCode"></code></pre>
    </div>

    <!-- Meta Info -->
    <div id="metaInfo" class="mt-6 flex items-center gap-4 text-xs text-gray-400 flex-wrap"></div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
